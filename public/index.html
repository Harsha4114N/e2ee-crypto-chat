<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureTalk Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="demo-toast" class="toast" aria-live="polite"></div>

    <section id="login-screen" class="screen active">
        <div class="auth-card">
            <div class="brand">SecureTalk</div>
            <h1>Private chat with no extra confusion.</h1>
            <p class="subtitle">Use a simple name and start chatting in seconds.</p>

            <div id="login-form-wrapper">
                <div id="saved-user-panel" class="saved-user-panel hidden">
                    <div class="welcome-chip">Welcome back</div>
                    <button id="welcome-back-button" class="primary-btn large-btn">
                        Continue as <span id="saved-username-label">Guest</span>
                    </button>
                    <button id="different-user-button" class="ghost-btn small-btn">Use a different name</button>
                </div>

                <div id="new-user-form" class="new-user-form">
                    <label for="username-input">Choose your display name</label>
                    <input id="username-input" type="text" maxlength="24" placeholder="Enter a name" autocomplete="off">
                    <button id="join-button" class="primary-btn">Create My ID</button>
                </div>
            </div>
        </div>
    </section>

    <section id="chat-screen" class="screen hidden">
        <div class="chat-layout">
            <aside class="chat-panel">
                <div class="panel-header">
                    <div class="brand-row">
                        <div class="brand small">SecureTalk</div>
                        <span id="connection-status" class="connection-pill disconnected">Offline</span>
                    </div>
                    <button id="logout-button" class="ghost-btn">Log out</button>
                </div>

                <div class="toolbar">
                    <button id="security-toggle" class="mode-toggle secure active">🔒 Secure Chat (Encryption)</button>
                    <button id="hacker-toggle" class="mode-toggle">👾 Simulate Hacker Attack</button>
                </div>

                <div class="chat-summary">
                    <div class="chat-summary-row">
                        <div>
                            <span class="summary-label">Talking to</span>
                            <strong id="chat-partner">Pick a person</strong>
                        </div>
                        <button id="clear-chat-button" class="clear-chat-btn" type="button" aria-label="Clear chat history">
                            🗑️
                        </button>
                    </div>
                </div>

                <div class="people-panel">
                    <div class="people-header">
                        <span>People online</span>
                        <span id="active-user-badge" class="user-pill">You</span>
                    </div>
                    <div id="active-users-list" class="people-list"></div>
                </div>

                <div class="composer-wrap">
                    <div id="message-log" class="message-log"></div>

                    <div class="composer">
                        <input id="message-input" type="text" placeholder="Type a message..." autocomplete="off">
                        <button id="send-button">Send</button>
                    </div>
                </div>
            </aside>

            <aside class="info-panel">
                <div class="info-header">
                    <div class="info-icon">🔐</div>
                    <h2>What’s happening</h2>
                </div>
                <div id="explanation-card" class="explanation-card neutral">
                    Choose a person to start a secure conversation.
                </div>
            </aside>
        </div>
    </section>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
